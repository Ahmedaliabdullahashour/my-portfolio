<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="Stylised portrait placeholder with the initials AA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63a4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#63a4ff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="480" height="560" fill="url(#bg)"/>
  <rect width="480" height="560" fill="url(#grid)"/>
  <ellipse cx="240" cy="190" rx="240" ry="210" fill="url(#halo)"/>

  <circle cx="240" cy="250" r="150" fill="none" stroke="url(#ring)" stroke-width="1"/>
  <circle cx="240" cy="250" r="186" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="3 9" opacity="0.55"/>

  <ellipse cx="240" cy="540" rx="210" ry="70" fill="#3b82f6" opacity="0.18" filter="url(#soft)"/>

  <!-- stylised portrait -->
  <g>
    <circle cx="240" cy="214" r="72" fill="url(#figure)"/>
    <circle cx="240" cy="214" r="72" fill="none" stroke="#9cc4ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M240 300c-82 0-134 46-146 118-4 24-6 42-6 62h304c0-20-2-38-6-62-12-72-64-118-146-118Z" fill="url(#figure)"/>
    <path d="M240 300c-82 0-134 46-146 118-4 24-6 42-6 62h304c0-20-2-38-6-62-12-72-64-118-146-118Z" fill="none" stroke="#9cc4ff" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <g opacity="0.5">
    <path d="M120 118h56" stroke="#63a4ff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M120 128h32" stroke="#63a4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M360 118h-56" stroke="#63a4ff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M360 128h-32" stroke="#63a4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <text x="240" y="512" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="14" fill="#dbe8ff" opacity="0.16">AA</text>
</svg>
