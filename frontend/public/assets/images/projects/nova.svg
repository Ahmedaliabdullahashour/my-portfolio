    <text x="480" y="92">Apparel</text>
    <text x="546" y="92">Objects</text>
    <text x="608" y="92">Journal</text>
  </g>
  <circle cx="752" cy="86" r="13" fill="#141f33" stroke="#243450"/>
  <path d="M746 82h12l-1.5 8h-9z" fill="none" stroke="#93a1bb" stroke-width="1.2"/>
  <path d="M749 82v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#93a1bb" stroke-width="1.2"/>
  <path d="M96 108h688" stroke="#1a2740"/>

