    <rect x="404" y="330" width="56" height="56" rx="10" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.4"/>
    <circle cx="432" cy="358" r="16" fill="#2dd4bf" opacity="0.3"/>
    <rect x="344" y="428" width="120" height="9" rx="4" fill="#334155"/>
    <text x="344" y="462" font-family="Sora, sans-serif" font-size="13" fill="#e9eefb">Ceramic Lamp</text>
