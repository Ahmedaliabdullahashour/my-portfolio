  <rect x="96" y="132" width="688" height="140" rx="14" fill="url(#banner)"/>
  <rect x="96" y="132" width="688" height="140" rx="14" fill="none" stroke="#2a4a7a" stroke-opacity="0.5"/>
  <text x="126" y="182" font-family="Inter, sans-serif" font-size="10" letter-spacing="3" fill="#9cc4ff">SPRING COLLECTION</text>
