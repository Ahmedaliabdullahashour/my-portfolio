    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#111c31"/>
    </linearGradient>
  </defs>

  <rect width="880" height="560" fill="url(#bg)"/>
  <circle cx="120" cy="500" r="240" fill="#0e7490" opacity="0.1"/>
  <circle cx="800" cy="70" r="200" fill="#2563eb" opacity="0.12"/>

  <rect x="64" y="48" width="752" height="464" rx="18" fill="#0a1220" stroke="#1e2c45"/>

