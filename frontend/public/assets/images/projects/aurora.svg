  <rect x="518" y="426" width="256" height="66" rx="12" fill="#0d1728" stroke="#1a2740"/>
  <circle cx="556" cy="459" r="20" fill="none" stroke="#1e2c45" stroke-width="6"/>
  <circle cx="556" cy="459" r="20" fill="none" stroke="#63a4ff" stroke-width="6" stroke-dasharray="94 126" stroke-linecap="round" transform="rotate(-90 556 459)"/>
  <text x="590" y="452" font-family="Inter, sans-serif" font-size="10" fill="#64748b">RETENTION</text>
  <text x="590" y="474" font-family="Sora, sans-serif" font-size="18" font-weight="600" fill="#e9eefb">74.8%</text>
