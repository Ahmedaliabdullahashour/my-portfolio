    <text x="622" y="149" font-family="Inter, Segoe UI, sans-serif" font-size="10" letter-spacing="1.5" fill="#64748b">CONVERSION</text>
    <text x="622" y="180" font-family="Sora, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#e9eefb">4.6%</text>
