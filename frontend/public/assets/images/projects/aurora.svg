    <text x="732" y="175" font-family="Inter, sans-serif" font-size="9" fill="#fbbf24">+2%</text>
  </g>

  <!-- main chart -->
  <rect x="236" y="228" width="538" height="180" rx="12" fill="#0d1728" stroke="#1a2740"/>
  <text x="256" y="256" font-family="Sora, sans-serif" font-size="12" fill="#94a3b8">Traffic overview</text>
  <path d="M256 386 L300 350 L350 362 L400 312 L450 330 L500 286 L550 300 L600 258 L650 276 L700 236 L754 250 L754 386 Z" fill="url(#chart)"/>
  <path d="M256 386 L300 350 L350 362 L400 312 L450 330 L500 286 L550 300 L600 258 L650 276 L700 236 L754 250" fill="none" stroke="#63a4ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="700" cy="236" r="4" fill="#63a4ff"/>
  <circle cx="700" cy="236" r="9" fill="#63a4ff" opacity="0.2"/>
  <g stroke="#1a2740" stroke-width="1">
    <path d="M256 300h498"/><path d="M256 344h498"/>
  </g>

  <!-- bars -->
  <rect x="236" y="426" width="266" height="66" rx="12" fill="#0d1728" stroke="#1a2740"/>
  <g fill="url(#accent)">
    <rect x="258" y="462" width="14" height="18" rx="4" opacity="0.45"/>
    <rect x="282" y="452" width="14" height="28" rx="4" opacity="0.55"/>
    <rect x="306" y="442" width="14" height="38" rx="4" opacity="0.7"/>
    <rect x="330" y="456" width="14" height="24" rx="4" opacity="0.5"/>
    <rect x="354" y="434" width="14" height="46" rx="4"/>
    <rect x="378" y="446" width="14" height="34" rx="4" opacity="0.8"/>
    <rect x="402" y="426" width="14" height="54" rx="4"/>
    <rect x="426" y="450" width="14" height="30" rx="4" opacity="0.6"/>
    <rect x="450" y="438" width="14" height="42" rx="4" opacity="0.85"/>
