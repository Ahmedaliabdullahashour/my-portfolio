<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Aurora analytics dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1526"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63a4ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="880" height="560" fill="url(#bg)"/>
  <rect width="880" height="560" fill="url(#lines)"/>
  <circle cx="760" cy="60" r="220" fill="#2563eb" opacity="0.12"/>

  <!-- window -->
  <rect x="60" y="52" width="760" height="456" rx="18" fill="#0b1322" stroke="#1e2c45"/>
  <rect x="60" y="52" width="760" height="46" rx="18" fill="#0e1829"/>
  <rect x="60" y="80" width="760" height="18" fill="#0e1829"/>
  <circle cx="86" cy="75" r="5" fill="#fb7185"/>
  <circle cx="104" cy="75" r="5" fill="#fbbf24"/>
  <circle cx="122" cy="75" r="5" fill="#34d399"/>
  <rect x="150" y="66" width="120" height="18" rx="9" fill="#141f33"/>
  <text x="166" y="79" font-family="Sora, Segoe UI, sans-serif" font-size="10" fill="#64748b">aurora.app</text>

  <!-- sidebar -->
  <rect x="60" y="98" width="150" height="410" fill="#0a1220"/>
  <rect x="78" y="120" width="76" height="14" rx="7" fill="url(#accent)"/>
  <g fill="#1b2940">
    <rect x="78" y="160" width="114" height="12" rx="6"/>
    <rect x="78" y="186" width="92" height="12" rx="6"/>
    <rect x="78" y="212" width="102" height="12" rx="6"/>
    <rect x="78" y="238" width="80" height="12" rx="6"/>
  </g>
  <rect x="78" y="160" width="114" height="12" rx="6" fill="#3b82f6" opacity="0.35"/>

  <!-- KPIs -->
  <g>
    <rect x="236" y="120" width="170" height="86" rx="12" fill="#0f1a2c" stroke="#1a2740"/>
    <text x="254" y="149" font-family="Inter, Segoe UI, sans-serif" font-size="10" letter-spacing="1.5" fill="#64748b">REVENUE</text>
    <text x="254" y="180" font-family="Sora, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#e9eefb">$48.2k</text>
    <rect x="352" y="160" width="38" height="22" rx="11" fill="#34d399" opacity="0.15"/>
    <text x="364" y="175" font-family="Inter, sans-serif" font-size="9" fill="#34d399">+12%</text>
  </g>
  <g>
    <rect x="420" y="120" width="170" height="86" rx="12" fill="#0f1a2c" stroke="#1a2740"/>
    <text x="438" y="149" font-family="Inter, Segoe UI, sans-serif" font-size="10" letter-spacing="1.5" fill="#64748b">VISITORS</text>
    <text x="438" y="180" font-family="Sora, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#e9eefb">12,904</text>
    <rect x="536" y="160" width="38" height="22" rx="11" fill="#3b82f6" opacity="0.15"/>
    <text x="548" y="175" font-family="Inter, sans-serif" font-size="9" fill="#63a4ff">+8%</text>
  </g>
  <g>
