<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Meridian design system preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1322"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63a4ff"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sw1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="sw2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="sw3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  </defs>

  <rect width="880" height="560" fill="url(#bg)"/>
  <circle cx="740" cy="80" r="220" fill="#2563eb" opacity="0.12"/>
  <circle cx="110" cy="500" r="200" fill="#0e7490" opacity="0.09"/>

  <!-- panel -->
  <rect x="64" y="52" width="752" height="456" rx="20" fill="#0a1220" stroke="#1e2c45"/>
  <text x="96" y="98" font-family="Sora, sans-serif" font-size="16" font-weight="600" fill="#e9eefb">Meridian</text>
  <text x="96" y="120" font-family="Inter, sans-serif" font-size="10" letter-spacing="2" fill="#64748b">DESIGN SYSTEM · v1.0</text>
  <path d="M96 140h688" stroke="#1a2740"/>

  <!-- typography specimen -->
  <rect x="96" y="164" width="300" height="200" rx="14" fill="#0d1728" stroke="#1a2740"/>
  <text x="118" y="210" font-family="Inter, sans-serif" font-size="9" letter-spacing="2" fill="#64748b">TYPE SCALE</text>
  <text x="118" y="288" font-family="Sora, sans-serif" font-size="70" font-weight="700" fill="#e9eefb" letter-spacing="-3">Aa</text>
  <text x="118" y="318" font-family="Sora, sans-serif" font-size="12" fill="#93a1bb">Sora · Display</text>
  <text x="118" y="342" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Inter · Body · 16 / 1.7</text>

  <!-- colour swatches -->
  <rect x="412" y="164" width="372" height="200" rx="14" fill="#0d1728" stroke="#1a2740"/>
  <text x="434" y="194" font-family="Inter, sans-serif" font-size="9" letter-spacing="2" fill="#64748b">PALETTE</text>
  <g>
    <rect x="434" y="212" width="104" height="112" rx="10" fill="url(#sw1)"/>
    <rect x="550" y="212" width="104" height="112" rx="10" fill="url(#sw2)"/>
    <rect x="666" y="212" width="96" height="112" rx="10" fill="url(#sw3)"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="8.5" fill="#64748b">
    <text x="438" y="340">#3B82F6</text>
    <text x="554" y="340">#0B1220</text>
    <text x="670" y="340">#2DD4BF</text>
  </g>

  <!-- components -->
  <rect x="96" y="384" width="688" height="100" rx="14" fill="#0d1728" stroke="#1a2740"/>
  <text x="118" y="412" font-family="Inter, sans-serif" font-size="9" letter-spacing="2" fill="#64748b">COMPONENTS</text>

  <rect x="118" y="428" width="120" height="36" rx="18" fill="url(#a)"/>
  <text x="150" y="451" font-family="Sora, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Primary</text>

  <rect x="254" y="428" width="120" height="36" rx="18" fill="none" stroke="#2a4a7a"/>
  <text x="292" y="451" font-family="Sora, sans-serif" font-size="10" fill="#93a1bb">Ghost</text>

  <rect x="392" y="428" width="190" height="36" rx="10" fill="#060c17" stroke="#243450"/>
  <text x="410" y="450" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Input field…</text>

  <rect x="600" y="428" width="56" height="26" rx="13" fill="#34d399" opacity="0.14"/>
  <text x="612" y="445" font-family="Inter, sans-serif" font-size="9" fill="#34d399">Active</text>
  <circle cx="668" cy="441" r="10" fill="#3b82f6" opacity="0.9"/>
  <circle cx="664" cy="441" r="3" fill="#fff"/>
  <circle cx="700" cy="441" r="10" fill="#fbbf24" opacity="0.8"/>
  <circle cx="732" cy="441" r="10" fill="#fb7185" opacity="0.8"/>
</svg>
